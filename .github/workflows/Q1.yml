name: Q1 Archive XYZ

on:
  push:
    branches: [ "main" ]
    paths:
      - "XYZ.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-xyz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy XYZ.txt into Q1_archive_XYZ.txt
        run: |
          if [ ! -f XYZ.txt ]; then
            echo "Fichier XYZ.txt introuvable."
            exit 1
          fi
          cp XYZ.txt Q1_archive_XYZ.txt

      - name: Commit and push Q1_archive_XYZ.txt
        run: |
          git config user.name "AudricHarris"
          git config user.email "audricharrismail@gmail.com"
          git add Q1_archive_XYZ.txt
          if git diff --staged --quiet; then
            echo "Aucun changement détecté dans Q1_archive_XYZ.txt."
          else
            git commit -m "chore: update Q1_archive_XYZ.txt from XYZ.txt"
            git push
          fi
