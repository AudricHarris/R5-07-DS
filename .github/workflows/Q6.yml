name: Q6 Archive Java and Diff

on:
  push:
    paths:
      - 'Q6.java'
      - '.github/workflows/Q6.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive-and-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile and test Q6.java
        run: |
          javac Q6.java
          java Q6 4

      - name: Create Q6 archive and diff files
        run: |
          PREV_ARCHIVE=$(ls -1 Q6_archive_*.txt 2>/dev/null | sort | tail -n 1 || true)

          TIMESTAMP=$(date +'%d-%m-%Y-%H%M%S')
          NEW_ARCHIVE="Q6_archive_${TIMESTAMP}.txt"

          LINES=$(wc -l < Q6.java)
          CHARS=$(wc -m < Q6.java)

          {
            echo "Audric Harris"
            echo "Taille de Q6.java : ${LINES} lignes, ${CHARS} caracteres"
            echo "Fichier Q6.java :"
            cat Q6.java
          } > "$NEW_ARCHIVE"

          if [ -n "$PREV_ARCHIVE" ] && [ -f "$PREV_ARCHIVE" ]; then
            diff -u "$PREV_ARCHIVE" "$NEW_ARCHIVE" > Q6_différences.txt || true
          else
            echo "Aucun précédent fichier Q6_archive_*.txt trouvé pour comparaison." > Q6_différences.txt
          fi

          echo "NEW_ARCHIVE=$NEW_ARCHIVE" >> "$GITHUB_ENV"

      - name: Commit and push generated files
        run: |
          git config user.name "AudricHarris"
          git config user.email "audricharrismail@gmail.com"
          git add "$NEW_ARCHIVE" Q6_différences.txt
          if git diff --staged --quiet; then
            echo "Aucun changement à pousser."
          else
            git commit -m "Ajout de ${NEW_ARCHIVE} et Q6_différences.txt"
            git push
          fi
