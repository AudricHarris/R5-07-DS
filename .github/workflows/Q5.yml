name: Q5 Archive Java avec Date

on:
  push:
    paths:
      - 'Q5.java'
      - '.github/workflows/Q5.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile and test Q5.java
        run: |
          javac Q5.java
          java Q5 4

      - name: Create Q5_archive_JJ-MM-AAAA.txt
        run: |
          DATE_JJ_MM_AAAA=$(date +'%d-%m-%Y')
          ARCHIVE_NAME="Q5_archive_${DATE_JJ_MM_AAAA}.txt"
          {
            echo "Audric Harris"
            echo "Fichier Q5.java :"
            cat Q5.java
          } > "$ARCHIVE_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Commit and push archive
        run: |
          git config user.name "AudricHarris"
          git config user.email "audricharrismail@gmail.com"
          git add "$ARCHIVE_NAME"
          if git diff --staged --quiet; then
            echo "Aucun changement détecté dans $ARCHIVE_NAME."
          else
            git commit -m "Ajout de $ARCHIVE_NAME"
            git push
          fi
